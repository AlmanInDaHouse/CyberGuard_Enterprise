name: schema-validation

on:
  push:
    branches: [main]
    paths:
      - "schemas/**"
      # SPEC-022 §Operational §8: the SOAR playbooks are validated against their schema.
      - "playbooks/**"
      - ".github/workflows/schema-validation.yml"
  pull_request:
    paths:
      - "schemas/**"
      # SPEC-022 §Operational §8: the SOAR playbooks are validated against their schema.
      - "playbooks/**"
      - ".github/workflows/schema-validation.yml"

permissions:
  contents: read

jobs:
  validate:
    name: Validate CGES examples and SOAR playbooks against their schemas
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          # setup-node@v5 auto-caches when package.json has a `packageManager`
          # field (default package-manager-cache: true); the root declares
          # pnpm, so it tries to resolve pnpm BEFORE corepack puts it on PATH
          # and fails. Disable — this job uses npm -g, not pnpm.
          package-manager-cache: false

      - name: Install ajv-cli and ajv-formats
        run: npm install -g ajv-cli ajv-formats

      - name: Validate every example payload
        run: |
          set -euo pipefail
          shopt -s nullglob
          examples=(schemas/cges/v0.1/examples/*.json)
          if [ ${#examples[@]} -eq 0 ]; then
            echo "No examples found under schemas/cges/v0.1/examples/. Failing."
            exit 1
          fi
          for f in "${examples[@]}"; do
            echo "::group::Validate $f"
            ajv validate \
              --spec=draft2020 \
              -c ajv-formats \
              -s schemas/cges/v0.1/event.json \
              -r "schemas/cges/v0.1/common/*.json" \
              -r "schemas/cges/v0.1/objects/*.json" \
              -r "schemas/cges/v0.1/classes/*.json" \
              -d "$f" \
              --all-errors \
              --strict=false
            echo "::endgroup::"
          done

      - name: Validate every SOAR playbook
        # SPEC-022 §Operational §8 — ajv-cli reads YAML data files. The loader's own
        # policy (unique ids, placeholders, no live agent.isolate) runs in ts-ci.
        run: |
          set -euo pipefail
          shopt -s nullglob
          playbooks=(playbooks/*.yml playbooks/*.yaml)
          if [ ${#playbooks[@]} -eq 0 ]; then
            echo "No playbooks under playbooks/: nothing to validate."
            exit 0
          fi
          for f in "${playbooks[@]}"; do
            echo "::group::Validate $f"
            ajv validate \
              --spec=draft2020 \
              -s schemas/playbooks/v0.1/playbook.json \
              -d "$f" \
              --all-errors
            echo "::endgroup::"
          done

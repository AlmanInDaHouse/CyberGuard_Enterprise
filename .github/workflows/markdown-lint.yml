name: markdown-lint

on:
  push:
    branches: [main]
    paths:
      - "**/*.md"
      - ".markdownlint.yaml"
      - ".github/workflows/markdown-lint.yml"
  pull_request:
    paths:
      - "**/*.md"
      - ".markdownlint.yaml"
      - ".github/workflows/markdown-lint.yml"

permissions:
  contents: read

jobs:
  lint:
    name: Lint Markdown
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Run markdownlint
        uses: DavidAnson/markdownlint-cli2-action@v23
        with:
          globs: |
            **/*.md
            !**/node_modules/**
            !**/target/**
            !**/.next/**
            !**/dist/**
            !**/build/**

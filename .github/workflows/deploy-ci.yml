name: deploy-ci

# SPEC-023 §Operational §12: on a pull request that touches the deployment or what its
# images are built from, build the four product images from the commit and run
# deploy/docker/test/ against them: the images (deploy_ac_019's image half), the compose's
# contract (deploy_ac_001), the set-up script (deploy_ac_002) and the stack an operator brings
# up from the bundle (deploy_ac_003 and 006 to 012: the backup and restore need gpg, which the
# runner has), with a Linux debug build of cg-agent for deploy_ac_009 and 012. It pushes
# nothing. Its second job is the release's dry run (SPEC-023 §Operational §12, its Amendment
# 2026-10-26, item 4): the release's image builds and bundle step, pushed and attested nowhere,
# which deploy/docker/test/release.test.mjs reads. It also runs every Monday on main, and on
# demand, so that a change outside the repository that breaks the build shows (the runner's
# Docker, a registry or a package that stops serving a pinned version). Its third-party actions are pinned by commit SHA, the
# release they point to in the comment.
on:
  pull_request:
    paths:
      - "deploy/**"
      - "docs/operations/**"
      - "services/**"
      - "dashboard/**"
      - "agent/**"
      - "rules/**"
      - "playbooks/**"
      - "schemas/playbooks/**"
      - "LICENSE"
      - "NOTICE"
      - ".dockerignore"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".github/scripts/check-licences.mjs"
      - ".github/scripts/licences-allowed.json"
      - ".github/scripts/third-party-notices.mjs"
      - ".github/scripts/licence-texts/**"
      - ".github/scripts/release-images.mjs"
      - ".github/scripts/release-bundle.mjs"
      - ".github/workflows/release.yml"
      - ".github/workflows/deploy-ci.yml"
  schedule:
    # Mondays, 06:41 UTC
    - cron: "41 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  images:
    name: The four images and the bundle, from the commit
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: "22"
          # The root package.json declares pnpm, which setup-node's cache would
          # resolve before corepack exists; this job installs nothing.
          package-manager-cache: false

      - name: Set up the supported Docker baseline
        uses: docker/setup-docker-action@1a6edb0ba9ac496f6850236981f15d8f9a82254d # v5.0.0
        with:
          version: v29.1.2
          set-host: true

      - name: Set up the supported Compose baseline
        uses: docker/setup-compose-action@112d3e30db3bf437d207fea57f22510569d1ab97 # v2.0.0
        with:
          version: v2.40.3

      - name: Build the images
        run: |
          set -eu
          build() {
            docker build --build-arg CG_VERSION=0.0.0-ci --build-arg CG_REVISION="$GITHUB_SHA" \
              -f "$2" -t "cyberguard-$1:test" .
          }
          build ingest services/ingest/Dockerfile
          build api services/api/Dockerfile
          build dashboard dashboard/Dockerfile
          build proxy deploy/docker/proxy/Dockerfile

      # deploy_ac_009's agent: the Linux debug build, which enrolls and heartbeats without
      # capture. The runner's rustup installs the toolchain rust-toolchain.toml pins.
      - name: Build cg-agent (Linux, debug)
        env:
          CARGO_INCREMENTAL: "0"
        run: |
          rustup toolchain install
          cargo build --locked -p cg-agent

      # deploy_ac_019's licence clause, on the repository: the production dependencies,
      # installed without their scripts, and the agent's crates (the fixture is a test below).
      - name: Check the licences
        run: |
          corepack enable
          pnpm install --frozen-lockfile --ignore-scripts
          node .github/scripts/check-licences.mjs

      # As root, as the installation runs setup.sh (its chown), one file at a time: each stack
      # test brings up a stack of its own.
      - name: Run deploy/docker/test against them
        env:
          GH_TOKEN: ${{ github.token }}
          CG_TEST_PRODUCTION_BASELINE: "1"
          CG_TEST_REVISION: ${{ github.sha }}
          CG_TEST_VERSION: 0.0.0-ci
          CG_TEST_STACK: "1"
          CG_TEST_AGENT: ${{ github.workspace }}/target/debug/cg-agent
        run: >-
          sudo --preserve-env=GH_TOKEN,DOCKER_HOST,CG_TEST_PRODUCTION_BASELINE,CG_TEST_REVISION,CG_TEST_VERSION,CG_TEST_STACK,CG_TEST_AGENT env "PATH=$PATH" "DOCKER_CONFIG=$HOME/.docker"
          node --test --test-concurrency=1 "deploy/docker/test/*.test.mjs"

  # SPEC-023 §Operational §12 and its Amendment 2026-10-26, item 4: the release's image builds
  # and bundle step, run as the release runs them but pushed nowhere and attested nowhere:
  # each image an OCI layout carrying BuildKit's SBOM and provenance, and the bundle naming
  # each by its digest. deploy/docker/test/release.test.mjs then reads them (deploy_ac_019's
  # and deploy_ac_001's dry-run halves).
  release-dry-run:
    name: The release's builds and bundle, pushed nowhere
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: "22"
          package-manager-cache: false

      - name: Set up the supported Docker baseline
        uses: docker/setup-docker-action@1a6edb0ba9ac496f6850236981f15d8f9a82254d # v5.0.0
        with:
          version: v29.1.2
          set-host: true

      - name: Set up the supported Compose baseline
        uses: docker/setup-compose-action@112d3e30db3bf437d207fea57f22510569d1ab97 # v2.0.0
        with:
          version: v2.40.3

      # The versions of Docker, Compose and Buildx the dry run ran with, in its log.
      - name: Docker's versions
        run: |
          docker version --format 'Docker Engine {{.Server.Version}}'
          docker compose version
          docker buildx version

      - name: Build the images and the bundle
        run: |
          set -eu
          node .github/scripts/release-images.mjs --version 0.0.0-ci --revision "$GITHUB_SHA" \
            --mode oci --out "$RUNNER_TEMP/release"
          node .github/scripts/release-bundle.mjs --version 0.0.0-ci \
            --digests "$RUNNER_TEMP/release/digests.json" --out "$RUNNER_TEMP/release"

      - name: Read them
        env:
          CG_TEST_RELEASE_DIR: ${{ runner.temp }}/release
          CG_TEST_RELEASE_VERSION: 0.0.0-ci
          CG_TEST_REVISION: ${{ github.sha }}
        run: node --test deploy/docker/test/release.test.mjs

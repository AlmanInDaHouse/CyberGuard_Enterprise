name: dependency-audit

# Debt #93 (threat model R12): the dependencies are audited against the public
# advisory databases on every change to them, and every week, so that an advisory
# published after a release is seen too.
# - pnpm: the production dependencies, where a high or critical advisory fails the
#   run and a moderate or low one is counted in the summary line and passes; and
#   every dependency, development ones included, where a critical advisory fails
#   the run (debt #110).
# - cargo: every crate Cargo.lock holds, the agent's development dependencies and
#   crates never compiled included. Any vulnerability advisory fails the run,
#   whatever its severity; an unmaintained, unsound or yanked crate is printed as a
#   warning and passes.
# - licences (debt #112, SPEC-023 §Operational §12): the production pnpm dependencies
#   and the agent's runtime crates, against .github/scripts/licences-allowed.json.

on:
  push:
    branches: [main]
    paths:
      - "pnpm-lock.yaml"
      - "package.json"
      - "services/*/package.json"
      - "dashboard/package.json"
      - "Cargo.lock"
      - "Cargo.toml"
      - "agent/**/Cargo.toml"
      - ".github/scripts/check-licences.mjs"
      - ".github/scripts/licences-allowed.json"
      - ".github/workflows/dependency-audit.yml"
  pull_request:
    paths:
      - "pnpm-lock.yaml"
      - "package.json"
      - "services/*/package.json"
      - "dashboard/package.json"
      - "Cargo.lock"
      - "Cargo.toml"
      - "agent/**/Cargo.toml"
      - ".github/scripts/check-licences.mjs"
      - ".github/scripts/licences-allowed.json"
      - ".github/workflows/dependency-audit.yml"
  schedule:
    # Mondays, 06:17 UTC.
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pnpm-audit:
    name: pnpm audit (production)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node 22
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          # As in ts-ci: the default cache resolves pnpm before corepack enables it.
          package-manager-cache: false

      - name: Enable Corepack (pnpm)
        run: corepack enable

      # Audits the lockfile; no install is needed.
      - name: pnpm audit --prod --audit-level=high
        run: pnpm audit --prod --audit-level=high

  pnpm-audit-all:
    name: pnpm audit (every dependency, critical)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node 22
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          package-manager-cache: false

      - name: Enable Corepack (pnpm)
        run: corepack enable

      - name: pnpm audit --audit-level=critical
        run: pnpm audit --audit-level=critical

  cargo-audit:
    name: cargo audit (the agent)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Rust toolchain (reads rust-toolchain.toml)
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          rustflags: ""

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked --version 0.22.2

      - name: cargo audit
        run: cargo audit

  licences:
    name: Licences (production dependencies and the agent's crates)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Set up Node 22
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          package-manager-cache: false

      - name: Enable Corepack (pnpm)
        run: corepack enable

      # pnpm licenses reads the installed packages' manifests; no install script runs.
      - name: pnpm install --frozen-lockfile --ignore-scripts
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Install Rust toolchain (reads rust-toolchain.toml)
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          rustflags: ""

      - name: Check the licences
        run: node .github/scripts/check-licences.mjs --report licences.md

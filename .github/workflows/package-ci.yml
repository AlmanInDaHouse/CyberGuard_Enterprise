name: package-ci

# SPEC-024 Amendment 2026-11-01, point 1: the pins of the agent's Windows package. Each nuget
# package is restored by its pinned version and checked against its recorded hash before
# anything loads it; WiX's EULA ID is checked to be the one Manuel accepted. A hosted Windows
# runner, the venue of §Test scenarios' "Packaging CI" line. The host job runs the real
# `cg-setup` against this disposable runner (the Amendment 2026-11-10, *Tests*), the msi
# job builds the agent's MSI and installs it there (the Amendment 2026-11-09, item 4 and
# *Tests*), and the bundle job builds the setup and runs it there (the Amendment 2026-11-12
# (second), *Tests*), so the agent's sources, the Rust toolchain and the release's version check
# are among the paths.

on:
  push:
    branches: [main]
    paths:
      - "deploy/windows/**"
      - "agent/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - ".cargo/**"
      - ".github/scripts/release-version.mjs"
      - ".github/scripts/check-licences.mjs"
      - ".github/scripts/licences-allowed.json"
      - ".github/workflows/package-ci.yml"
  pull_request:
    paths:
      - "deploy/windows/**"
      - "agent/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - ".cargo/**"
      - ".github/scripts/release-version.mjs"
      - ".github/scripts/check-licences.mjs"
      - ".github/scripts/licences-allowed.json"
      - ".github/workflows/package-ci.yml"

permissions:
  contents: read

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "1"

jobs:
  pins:
    name: Pins, hashes and the EULA ID
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Set up Node 22
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          package-manager-cache: false

      - name: Set up the pinned .NET SDK
        # v6.1.0, by its commit.
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73
        with:
          global-json-file: deploy/windows/global.json

      - name: Package tests
        run: node --test "deploy/windows/test/*.test.mjs"

      - name: Restore the pinned packages
        working-directory: deploy/windows
        run: dotnet restore pins/Pins.csproj

      - name: Check each package against its recorded hash
        working-directory: deploy/windows
        run: node pins/verify-pins.mjs

      - name: Restore the wix tool
        working-directory: deploy/windows
        run: dotnet tool restore

      - name: Check the tool's build and EULA ID
        working-directory: deploy/windows
        run: node pins/verify-pins.mjs --tool

  # SPEC-024 Amendment 2026-11-10, *Tests*: the real `cg-setup`, `preflight` then `reverse`,
  # against this runner's %ProgramData%, under a token with no privilege but
  # SeChangeNotifyPrivilege. Built only with cg-setup's test-only `host-tests` feature, here
  # alone; the test fails without acting outside a GitHub-hosted runner. Its red evidence was
  # the probe pull requests #117 (staged files owned by SYSTEM: 1307 without a privilege), #118
  # (a reversal that changes nothing) and #119 (the guard), closed without landing.
  host:
    name: cg-setup against the host
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Install Rust toolchain (reads rust-toolchain.toml)
        # v1.17.0, by its commit.
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659
        with:
          rustflags: ""

      - name: "cargo test, cg-setup against the host (host-tests)"
        run: cargo test -p cg-setup --features host-tests --no-fail-fast --test package_setup_host -- --test-threads=1

  # SPEC-024 §Data contracts §1 to §3 and install_ac_001, with the Amendment 2026-11-09, item 4
  # and *Tests*: the MSI built at a fixture release version, its refusals of versions outside
  # the release's form, then installed on this runner as the setup installs it, refused when
  # msiexec installs or upgrades it directly, and uninstalled. The install test builds only with
  # cg-setup's test-only `host-tests` feature, here alone, and fails without acting outside a
  # GitHub-hosted runner.
  msi:
    name: The MSI on the host
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      # The fixture release version: the agent, the MSI and the test are built with it.
      CG_RELEASE_VERSION: "1.2.3"
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: Set up Node 22
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: "22"
          package-manager-cache: false

      - name: Install Rust toolchain (reads rust-toolchain.toml)
        # v1.17.0, by its commit.
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659
        with:
          rustflags: ""

      - name: Set up the pinned .NET SDK
        # v6.1.0, by its commit.
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73
        with:
          global-json-file: deploy/windows/global.json

      - name: Build the agent at the fixture release version
        run: cargo build --release -p cg-agent

      - name: Restore the pinned packages
        working-directory: deploy/windows
        run: dotnet restore pins/Pins.csproj

      - name: Check each package against its recorded hash
        working-directory: deploy/windows
        run: node pins/verify-pins.mjs

      - name: Restore the wix tool
        working-directory: deploy/windows
        run: dotnet tool restore

      - name: Check the tool's build and EULA ID
        working-directory: deploy/windows
        run: node pins/verify-pins.mjs --tool

      - name: The MSI refuses a version outside the release's form
        run: node deploy/windows/test/msi-version-matrix.mjs target/release/cg-agent.exe

      - name: Build the MSI, the same package at a higher version, and its test build
        working-directory: deploy/windows
        run: |
          $exe = (Resolve-Path ../../target/release/cg-agent.exe).Path
          $fixture = $env:CG_RELEASE_VERSION
          foreach ($v in $fixture, "1.2.4") {
            $env:CG_RELEASE_VERSION = $v
            $out = Join-Path $env:RUNNER_TEMP "msi-$v"
            dotnet build --no-incremental msi/CyberGuardAgent.wixproj -c Release "-p:AgentExe=$exe" "-p:OutputPath=$out/"
            if ($LASTEXITCODE -ne 0) { exit 1 }
          }
          # The test build, whose deferred action fails inside the transaction (SPEC-024
          # Amendment 2026-11-12 (second), *Tests*); the test reads that it alone has one.
          $env:CG_RELEASE_VERSION = $fixture
          $out = Join-Path $env:RUNNER_TEMP "msi-failing"
          dotnet build --no-incremental msi/CyberGuardAgent.wixproj -c Release "-p:AgentExe=$exe" "-p:CgInjectFailure=1" "-p:OutputPath=$out/"
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: "cargo test, the MSI on the host (host-tests)"
        run: |
          $v = $env:CG_RELEASE_VERSION
          $env:CG_TEST_MSI = Join-Path (Join-Path $env:RUNNER_TEMP "msi-$v") "cyberguard-agent-$v-x64.msi"
          $env:CG_TEST_MSI_NEXT = Join-Path (Join-Path $env:RUNNER_TEMP "msi-1.2.4") "cyberguard-agent-1.2.4-x64.msi"
          $env:CG_TEST_MSI_FAILING = Join-Path (Join-Path $env:RUNNER_TEMP "msi-failing") "cyberguard-agent-$v-x64.msi"
          $env:CG_TEST_AGENT_EXE = (Resolve-Path target/release/cg-agent.exe).Path
          $env:CG_TEST_MSI_LOGS = Join-Path $env:RUNNER_TEMP "msiexec-logs"
          cargo test -p cg-setup --features host-tests --no-fail-fast --test package_msi_host -- --test-threads=1
          exit $LASTEXITCODE

      # msiexec's verbose logs, which hold no secret: the MSI carries none.
      - name: msiexec's logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: msiexec-logs
          path: ${{ runner.temp }}/msiexec-logs
          if-no-files-found: ignore
          retention-days: 7

  # SPEC-024 Amendment 2026-11-12 (second), with its *Tests*: the setup built at the fixture
  # release version, at a higher one, at the higher one with the test build of the MSI that fails
  # inside its transaction, and a second time at the fixture version; its build's refusals of a
  # version outside the release's form or of packages of another version; then installed,
  # refused, upgraded, restored, rebuilt, repaired and uninstalled on this runner against
  # cg-agent's test servers. The test builds only with cg-setup's test-only `host-tests` feature,
  # here alone, and fails without acting outside a GitHub-hosted runner.
  bundle:
    name: The setup on the host
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      # The fixture release version: the setup, its packages and the test are built with it.
      CG_RELEASE_VERSION: "1.2.3"
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: Set up Node 22
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: "22"
          package-manager-cache: false

      - name: Install Rust toolchain (reads rust-toolchain.toml)
        # v1.17.0, by its commit.
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659
        with:
          rustflags: ""

      - name: Set up the pinned .NET SDK
        # v6.1.0, by its commit.
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73
        with:
          global-json-file: deploy/windows/global.json

      - name: Restore the pinned packages
        working-directory: deploy/windows
        run: dotnet restore pins/Pins.csproj

      - name: Check each package against its recorded hash
        working-directory: deploy/windows
        run: node pins/verify-pins.mjs

      - name: Restore the wix tool
        working-directory: deploy/windows
        run: dotnet tool restore

      - name: Check the tool's build and EULA ID
        working-directory: deploy/windows
        run: node pins/verify-pins.mjs --tool

      # Each setup carries the agent, the MSI and cg-setup.exe of its own version; the fixture's
      # is built last, so that target/release holds it for the matrix below.
      - name: Build the setups
        run: |
          $t = $env:RUNNER_TEMP
          $fixture = $env:CG_RELEASE_VERSION
          function Build-Setup($v, $tag, $fail) {
            $env:CG_RELEASE_VERSION = $v
            cargo build --release -p cg-agent -p cg-setup
            if ($LASTEXITCODE -ne 0) { exit 1 }
            $bin = Join-Path $t "bin-$tag"
            New-Item -ItemType Directory -Force $bin | Out-Null
            Copy-Item target/release/cg-agent.exe, target/release/cg-setup.exe $bin
            Push-Location deploy/windows
            $msiOut = Join-Path $t "msi-$tag"
            dotnet build --no-incremental msi/CyberGuardAgent.wixproj -c Release "-p:AgentExe=$bin\cg-agent.exe" "-p:CgInjectFailure=$fail" "-p:OutputPath=$msiOut/"
            if ($LASTEXITCODE -ne 0) { exit 1 }
            $setupOut = Join-Path $t "setup-$tag"
            dotnet build --no-incremental bundle/CyberGuardSetup.wixproj -c Release "-p:Msi=$msiOut\cyberguard-agent-$v-x64.msi" "-p:SetupExe=$bin\cg-setup.exe" "-p:OutputPath=$setupOut/"
            if ($LASTEXITCODE -ne 0) { exit 1 }
            Pop-Location
          }
          Build-Setup "1.2.4" "next" ""
          Build-Setup "1.2.4" "failing" "1"
          Build-Setup $fixture "rebuilt" ""
          Build-Setup $fixture "current" ""

      - name: The setup's build refuses another version or its packages' other versions
        run: node deploy/windows/test/bundle-version-matrix.mjs target/release/cg-agent.exe target/release/cg-setup.exe $env:CG_RELEASE_VERSION

      - name: "cargo test, the setup on the host (host-tests)"
        run: |
          $t = $env:RUNNER_TEMP
          $v = $env:CG_RELEASE_VERSION
          $env:CG_TEST_SETUP = Join-Path $t "setup-current\cyberguard-agent-$v-x64-setup.exe"
          $env:CG_TEST_SETUP_NEXT = Join-Path $t "setup-next\cyberguard-agent-1.2.4-x64-setup.exe"
          $env:CG_TEST_SETUP_FAILING = Join-Path $t "setup-failing\cyberguard-agent-1.2.4-x64-setup.exe"
          $env:CG_TEST_SETUP_REBUILT = Join-Path $t "setup-rebuilt\cyberguard-agent-$v-x64-setup.exe"
          $env:CG_TEST_MSI = Join-Path $t "msi-current\cyberguard-agent-$v-x64.msi"
          $env:CG_TEST_MSI_FAILING = Join-Path $t "msi-failing\cyberguard-agent-1.2.4-x64.msi"
          $env:CG_TEST_AGENT_EXE = Join-Path $t "bin-current\cg-agent.exe"
          $env:CG_TEST_SETUP_EXE = Join-Path $t "bin-current\cg-setup.exe"
          $env:CG_TEST_BURN_LOGS = Join-Path $t "burn-logs"
          cargo test -p cg-setup --features host-tests --no-fail-fast --test package_bundle_host -- --test-threads=1
          exit $LASTEXITCODE

      # Burn's and Windows Installer's logs, which hold no secret: the test asserts that the
      # token is in none of them.
      - name: Burn's logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: burn-logs
          path: ${{ runner.temp }}/burn-logs
          if-no-files-found: ignore
          retention-days: 7

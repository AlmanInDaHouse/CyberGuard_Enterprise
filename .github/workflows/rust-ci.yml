name: rust-ci

on:
  push:
    branches: [main]
    paths:
      - "agent/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - ".cargo/**"
      - ".github/workflows/rust-ci.yml"
      - ".github/scripts/agent-version-matrix.mjs"
  pull_request:
    paths:
      - "agent/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - ".cargo/**"
      - ".github/workflows/rust-ci.yml"
      - ".github/scripts/agent-version-matrix.mjs"

permissions:
  contents: read

jobs:
  # PROBE (S66, closed without landing): the adoption's code 10 with the real
  # lock against mutation M1, the adoption without the lock.
  check-windows:
    name: probe (windows)
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Rust toolchain (reads rust-toolchain.toml)
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          rustflags: ""

      - name: "probe: package_adoption_a_held_lock_is_code_10_before_any_change"
        continue-on-error: true
        run: cargo test -p cg-agent --features scm-tests --no-fail-fast --test package_adoption_service -- --test-threads=1 package_adoption_a_held_lock_is_code_10_before_any_change

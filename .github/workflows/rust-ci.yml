name: rust-ci

on:
  pull_request:
    paths:
      - "agent/**"
      - ".github/workflows/rust-ci.yml"

permissions:
  contents: read

jobs:
  # PROBE (S86, closed without landing): SPEC-024 Amendment 2026-11-20's
  # CI-confined tests, built against main's code without point 2's change,
  # to see each fail for the missing behaviour (CLAUDE.md compensating
  # control 1). The test steps cannot fail the job.
  check-windows:
    name: probe (windows)
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Rust toolchain (reads rust-toolchain.toml)
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          rustflags: ""

      - name: "probe: install_ac_013's and the adoption's service tests (scm-tests)"
        continue-on-error: true
        run: cargo test -p cg-agent --features scm-tests --no-fail-fast --test install_ac_013_migration --test package_adoption_service -- --test-threads=1

      - name: "probe: cg-setup's service tests (scm-tests)"
        continue-on-error: true
        run: cargo test -p cg-setup --features scm-tests --no-fail-fast --test package_setup_service -- --test-threads=1

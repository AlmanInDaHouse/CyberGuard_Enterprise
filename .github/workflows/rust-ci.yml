name: rust-ci

on:
  push:
    branches: [main]
    paths:
      - "agent/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - ".github/workflows/rust-ci.yml"
  pull_request:
    paths:
      - "agent/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - ".github/workflows/rust-ci.yml"

permissions:
  contents: read

jobs:
  check:
    name: cargo fmt + clippy + test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Rust toolchain (reads rust-toolchain.toml)
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          rustflags: ""

      - name: cargo fmt --check
        run: cargo fmt --all -- --check

      - name: cargo clippy (deny warnings)
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: cargo test
        run: cargo test --all

  # SPEC-017 capture_ac_013: the agent's Windows code (ETW session,
  # side-channel helpers, DPAPI, path translation) is compiled, linted and
  # tested here. The tests that need real ETW or the real Security log (an
  # elevated process) are #[ignore]d in `cargo test --all`, and run in a step
  # of their own, as the runner's built-in Administrator (SPEC-017, the second
  # Amendment 2026-10-19). The elevated developer-local gate runs them too.
  check-windows:
    name: cargo fmt + clippy + test (windows)
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Rust toolchain (reads rust-toolchain.toml)
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          rustflags: ""

      - name: cargo fmt --check
        run: cargo fmt --all -- --check

      - name: cargo clippy (deny warnings)
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: cargo test
        run: cargo test --all

      - name: "cargo test, the #[ignore]d real-ETW and Security-log tests"
        run: cargo test -p cg-agent --no-fail-fast -- --ignored --test-threads=1

name: ts-ci

on:
  push:
    branches: [main]
    paths:
      - "services/ingest/**"
      - "services/api/**"
      - "dashboard/**"
      - "pnpm-workspace.yaml"
      - "pnpm-lock.yaml"
      - "package.json"
      - ".github/workflows/ts-ci.yml"
  pull_request:
    paths:
      - "services/ingest/**"
      - "services/api/**"
      - "dashboard/**"
      - "pnpm-workspace.yaml"
      - "pnpm-lock.yaml"
      - "package.json"
      - ".github/workflows/ts-ci.yml"

permissions:
  contents: read

jobs:
  check:
    name: ingest — tsc + biome + vitest
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/ingest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node 22
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          # setup-node@v5 default package-manager-cache: true auto-resolves the
          # root packageManager (pnpm) BEFORE corepack enable puts it on PATH,
          # failing the step. Disable — mirrors the no-setup-node-cache rationale
          # in the Install step comment below (corepack cache-save can't find pnpm).
          package-manager-cache: false

      - name: Enable Corepack (pnpm)
        run: corepack enable

      # No setup-node pnpm cache: with corepack, the cache save post-step
      # cannot find pnpm and fails the job. Install is fast enough without
      # it; a pnpm store cache can be added later via pnpm/action-setup.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck (tsc --noEmit)
        run: pnpm run typecheck

      - name: Lint (biome)
        run: pnpm run lint

      # The marquee acceptance test (SPEC-004 AC-001) runs the REAL cg-agent
      # binary against the real testcontainers-backed server — no mock. Build
      # it here so vitest can spawn it from <repo-root>/target/debug/cg-agent.
      - name: Install Rust toolchain (reads rust-toolchain.toml)
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          rustflags: ""

      - name: Build cg-agent (for the polyglot marquee test)
        working-directory: ${{ github.workspace }}
        run: cargo build -p cg-agent

      - name: Test (vitest)
        run: pnpm test

  check-api:
    name: api — tsc + biome + vitest
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/api
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node 22
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          # setup-node@v5 default package-manager-cache: true auto-resolves the
          # root packageManager (pnpm) BEFORE corepack enable puts it on PATH,
          # failing the step. Disable — mirrors the no-setup-node-cache rationale
          # in the Install step comment below (corepack cache-save can't find pnpm).
          package-manager-cache: false

      - name: Enable Corepack (pnpm)
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck (tsc --noEmit)
        run: pnpm run typecheck

      - name: Lint (biome)
        run: pnpm run lint

      # auth-core needs no ETW and no agent — Postgres + Redis via testcontainers
      # only (ADR-0003). No Rust build step here, unlike the ingest job.
      - name: Test (vitest)
        run: pnpm test

  check-dashboard:
    name: dashboard — next build + tsc + biome + vitest
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node 22
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          # setup-node@v5 default package-manager-cache: true auto-resolves the
          # root packageManager (pnpm) BEFORE corepack enable puts it on PATH,
          # failing the step. Disable — mirrors the no-setup-node-cache rationale
          # in the Install step comment below (corepack cache-save can't find pnpm).
          package-manager-cache: false

      - name: Enable Corepack (pnpm)
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # next build is the heavy structural gate. It runs FIRST so it regenerates
      # next-env.d.ts + .next/types (gitignored) before the tsc typecheck reads them.
      - name: Build (next build)
        run: pnpm run build

      - name: Typecheck (tsc --noEmit)
        run: pnpm run typecheck

      - name: Lint (biome)
        run: pnpm run lint

      # dash_ac_001 (server-side data-access) drives the REAL read-API in-process via
      # services/api's buildApp/app.inject, backed by Postgres + Redis testcontainers
      # (like check-api); dash_ac_002 renders presentational components under jsdom.
      - name: Test (vitest)
        run: pnpm test

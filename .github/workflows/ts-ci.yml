name: ts-ci

on:
  push:
    branches: [main]
    paths:
      - "services/ingest/**"
      - ".github/workflows/ts-ci.yml"
  pull_request:
    paths:
      - "services/ingest/**"
      - ".github/workflows/ts-ci.yml"

permissions:
  contents: read

defaults:
  run:
    working-directory: services/ingest

jobs:
  check:
    name: tsc + biome + vitest
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Enable Corepack (pnpm)
        run: corepack enable

      # No setup-node pnpm cache: with corepack, the cache save post-step
      # cannot find pnpm and fails the job. Install is fast enough without
      # it; a pnpm store cache can be added later via pnpm/action-setup.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck (tsc --noEmit)
        run: pnpm run typecheck

      - name: Lint (biome)
        run: pnpm run lint

      - name: Test (vitest)
        run: pnpm test

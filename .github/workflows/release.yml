name: release

# SPEC-023 §Operational §12 and its Amendment 2026-10-26, item 4: a tag v<major>.<minor>.<patch>
# cuts a release. The tag's version is checked first (SPEC-024 Amendment 2026-11-01, point 3,
# debt #139): its form and MSI's limits, before any job pushes, attests or publishes. Then
# the licence check; then the four images are built for linux/amd64 with BuildKit's SBOM and
# provenance attestations, pushed to GHCR with the tags <version> and sha-<commit>, and
# attested; the agent's executable, its MSI and setup and WiX's source archive are built,
# checked against each other and attested on Windows (SPEC-024 Amendment 2026-11-14); the
# bundle names each image by its digest and is attested; and the GitHub Release carries six
# payload assets and SHA256SUMS. Each job has the permissions it uses alone, and every
# third-party action is pinned by commit SHA, the release it points to in the comment.
# deploy-ci.yml runs the image builds and the bundle step as a dry run, and package-ci.yml the
# Windows assets' build and checks, pushing and attesting nothing; their runners are pinned
# images (#149), changed together. The first release waits for F2 to F4 and for Manuel's
# explicit OK (ADR-0022 §7).
on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # SPEC-024 Amendment 2026-11-01, point 3 (#139): every other job waits for this one, so a
  # tag out of form or beyond MSI's limits (v01.2.3, v300.0.0) pushes, attests and publishes
  # nothing.
  version:
    name: The tag's release version
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: "22"
          package-manager-cache: false

      # The script's printed version must be the tag's, so a check that did not run fails too.
      - name: Check the tag
        shell: bash
        run: |
          set -eu
          test "$(node .github/scripts/release-version.mjs "$GITHUB_REF_NAME")" = "${GITHUB_REF_NAME#v}"

  licences:
    name: The licence check and its report
    needs: version
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: "22"
          package-manager-cache: false

      # The production dependencies, installed without their scripts, and the agent's and cg-setup's crates,
      # read with the toolchain rust-toolchain.toml pins.
      - name: Check the licences
        run: |
          set -eu
          V="${GITHUB_REF_NAME#v}"
          corepack enable
          pnpm install --frozen-lockfile --ignore-scripts
          rustup toolchain install
          node .github/scripts/check-licences.mjs --report "licences-$V.md"

      - name: Keep the report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: licences
          path: licences-*.md
          if-no-files-found: error

  images:
    name: The four images, pushed and attested
    needs: licences
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    outputs:
      digests: ${{ steps.build.outputs.digests }}
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: "22"
          package-manager-cache: false

      - name: Log in to GHCR
        env:
          GHCR_TOKEN: ${{ github.token }}
        run: printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin

      - name: Build and push
        id: build
        run: |
          set -eu
          node .github/scripts/release-images.mjs --version "${GITHUB_REF_NAME#v}" \
            --revision "$GITHUB_SHA" --mode push --out "$RUNNER_TEMP/release"
          {
            printf 'digests='
            node -e 'process.stdout.write(JSON.stringify(JSON.parse(require("fs").readFileSync(process.argv[1],"utf8"))))' \
              "$RUNNER_TEMP/release/digests.json"
            printf '\n'
            for n in ingest api dashboard proxy; do
              printf '%s=%s\n' "$n" "$(node -e 'process.stdout.write(JSON.parse(require("fs").readFileSync(process.argv[1],"utf8"))[process.argv[2]])' "$RUNNER_TEMP/release/digests.json" "$n")"
            done
          } >> "$GITHUB_OUTPUT"

      - name: Attest ingest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/almanindahouse/cyberguard-ingest
          subject-digest: ${{ steps.build.outputs.ingest }}
          push-to-registry: true

      - name: Attest api
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/almanindahouse/cyberguard-api
          subject-digest: ${{ steps.build.outputs.api }}
          push-to-registry: true

      - name: Attest dashboard
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/almanindahouse/cyberguard-dashboard
          subject-digest: ${{ steps.build.outputs.dashboard }}
          push-to-registry: true

      - name: Attest proxy
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/almanindahouse/cyberguard-proxy
          subject-digest: ${{ steps.build.outputs.proxy }}
          push-to-registry: true

  # SPEC-024 Amendment 2026-11-14, points 1 to 5: the four Windows assets made from the tag in one
  # run, by the script package-ci's dry run runs: the pins and the EULA ID checked before WiX runs;
  # the agent and cg-setup at the tag's version (SPEC-024 §Data contracts §1, debt #131); the MSI
  # without the test build's define (#158); the setup; every check of point 2, installing nothing;
  # WiX's source archive, fetched by its pinned commit, whose LICENSE.TXT the licence report must
  # carry. No cache is restored: Rust through rustup from rust-toolchain.toml, Node and .NET with
  # their caches off. The four are attested once every check has passed.
  agent:
    name: The agent's executable, MSI, setup and WiX's source, built, checked and attested
    needs: licences
    runs-on: windows-2025
    timeout-minutes: 90
    permissions:
      contents: read
      id-token: write
      attestations: write
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "1"
      CARGO_INCREMENTAL: "0"
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: "22"
          package-manager-cache: false

      - name: Set up the pinned .NET SDK
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: deploy/windows/global.json

      - name: Fetch the licence report
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: licences
          path: ${{ runner.temp }}/licences

      # The build cannot mint an OIDC token: the request variables are blank in its step, and the
      # attestation's step keeps the job's id-token permission.
      - name: Build, check and archive the Windows assets
        shell: bash
        env:
          ACTIONS_ID_TOKEN_REQUEST_URL: ""
          ACTIONS_ID_TOKEN_REQUEST_TOKEN: ""
        run: |
          set -eu
          V="${GITHUB_REF_NAME#v}"
          rustup toolchain install
          node .github/scripts/release-windows.mjs build --version "$V" --out assets \
            --work "$RUNNER_TEMP/release-work" --report "$RUNNER_TEMP/licences/licences-$V.md"

      - name: Attest the Windows assets
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: assets/*

      - name: Keep the Windows assets
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: agent
          path: assets/*
          if-no-files-found: error

  bundle:
    name: The bundle, pinned by digest and attested
    needs: images
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: "22"
          package-manager-cache: false

      - name: Write the bundle
        env:
          DIGESTS: ${{ needs.images.outputs.digests }}
        run: |
          set -eu
          printf '%s' "$DIGESTS" > "$RUNNER_TEMP/digests.json"
          node .github/scripts/release-bundle.mjs --version "${GITHUB_REF_NAME#v}" \
            --digests "$RUNNER_TEMP/digests.json" --out .

      - name: Attest the bundle
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: cyberguard-deploy-*.tar.gz

      - name: Keep the bundle
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bundle
          path: cyberguard-deploy-*.tar.gz
          if-no-files-found: error

  publish:
    name: The GitHub Release
    needs: [licences, images, agent, bundle]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Fetch the assets
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: assets
          merge-multiple: true

      # gh is on the runner; the release is created on the pushed tag alone. SPEC-024 Amendment
      # 2026-11-14, point 5: six payload assets, each in SHA256SUMS, and nothing else downloaded
      # is published; WiX's source archive is the one wix-<release>-source.tar.gz the agent job
      # made.
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          V="${GITHUB_REF_NAME#v}"
          cd assets
          shopt -s nullglob
          SOURCES=(wix-*-source.tar.gz)
          test "${#SOURCES[@]}" -eq 1
          ASSETS=("cyberguard-deploy-$V.tar.gz" "cg-agent-$V-x86_64-pc-windows-msvc.exe" \
            "cyberguard-agent-$V-x64-setup.exe" "cyberguard-agent-$V-x64.msi" "licences-$V.md" \
            "${SOURCES[0]}")
          sha256sum "${ASSETS[@]}" > SHA256SUMS
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --verify-tag \
            --title "CyberGuard $V" \
            --notes "The server bundle, cyberguard-deploy-$V.tar.gz; the agent's setup, cyberguard-agent-$V-x64-setup.exe, its MSI, cyberguard-agent-$V-x64.msi, and its executable, cg-agent-$V-x86_64-pc-windows-msvc.exe; the licence report, licences-$V.md, with WiX's notices and MS-RL's text; the source of the WiX files the setup carries, ${SOURCES[0]}; and their SHA-256 sums, SHA256SUMS. Install: docs/operations/install.md at $GITHUB_REF_NAME." \
            "${ASSETS[@]}" SHA256SUMS

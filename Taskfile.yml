# Cross-platform task runner. See https://taskfile.dev
# Targets are stubs; each will be populated by its corresponding SPEC.

version: "3"

tasks:
  bootstrap:
    desc: "Initialize developer environment (dependencies, tools, local stack)."
    cmds:
      - echo "task bootstrap — populated by SPEC-XXX-bootstrap"

  up:
    desc: "Bring up local stack via docker compose."
    cmds:
      - echo "task up — populated by SPEC-XXX-infra"

  down:
    desc: "Tear down local stack."
    cmds:
      - echo "task down — populated by SPEC-XXX-infra"

  test:
    desc: "Run unit and integration tests across services."
    cmds:
      - echo "task test — populated by SPEC-XXX-ci"

  harness:
    desc: "Run end-to-end harness scenarios."
    cmds:
      - echo "task harness — populated by SPEC-XXX-harness"

  lint:
    desc: "Lint code, schemas, rules and docs."
    cmds:
      - echo "task lint — populated by SPEC-XXX-ci"

  validate-schemas:
    desc: "Validate the CGES example events and the SOAR playbooks against their schemas (ajv-cli)."
    cmds:
      # SPEC-022 §Operational §8 — the SOAR playbooks (ajv-cli reads YAML data files).
      - npx --yes -p ajv-cli ajv validate --spec=draft2020 -s schemas/playbooks/v0.1/playbook.json -d "playbooks/*.{yml,yaml}" --all-errors
      - npx --yes -p ajv-cli -p ajv-formats ajv validate --spec=draft2020 -c ajv-formats -s schemas/cges/v0.1/event.json -r "schemas/cges/v0.1/common/*.json" -r "schemas/cges/v0.1/objects/*.json" -r "schemas/cges/v0.1/classes/*.json" -d "schemas/cges/v0.1/examples/*.json" --all-errors --strict=false
      # Debts #39 and #40: every example under examples-invalid/ must be refused.
      - |
        ls schemas/cges/v0.1/examples-invalid/*.json > /dev/null 2>&1 || { echo "no invalid examples under schemas/cges/v0.1/examples-invalid/"; exit 1; }
        for f in schemas/cges/v0.1/examples-invalid/*.json; do
          if npx --yes -p ajv-cli -p ajv-formats ajv validate --spec=draft2020 -c ajv-formats -s schemas/cges/v0.1/event.json -r "schemas/cges/v0.1/common/*.json" -r "schemas/cges/v0.1/objects/*.json" -r "schemas/cges/v0.1/classes/*.json" -d "$f" --strict=false > /dev/null 2>&1; then
            echo "$f validated, but must be refused"; exit 1
          fi
          echo "$f refused, as it must be"
        done

  # ------------------------------------------------------------------
  # dev: local infrastructure (PG + pgvector / ClickHouse / Redis, the
  # ADR-0003 stores the code uses) with ingest and the api. See infra/dev/README.md.
  # ------------------------------------------------------------------
  dev:up:
    desc: "Bring the local dev stack up (detached). Requires infra/dev/.env."
    preconditions:
      - sh: 'test -f infra/dev/.env'
        msg: "infra/dev/.env not found. Run: cp infra/dev/.env.example infra/dev/.env"
    cmds:
      - docker compose -f infra/dev/docker-compose.dev.yml --env-file infra/dev/.env up -d --remove-orphans

  dev:down:
    desc: "Stop and remove dev containers. Named volumes are preserved; use dev:reset-data for a clean slate."
    cmds:
      - docker compose -f infra/dev/docker-compose.dev.yml --env-file infra/dev/.env down --remove-orphans

  dev:ps:
    desc: "Show status of dev containers."
    cmds:
      - docker compose -f infra/dev/docker-compose.dev.yml --env-file infra/dev/.env ps

  dev:logs:
    desc: "Tail logs (last 100 lines, follow). Optional: svc=<name> to filter to a single service."
    cmds:
      - docker compose -f infra/dev/docker-compose.dev.yml --env-file infra/dev/.env logs -f --tail=100 {{.svc}}

  dev:health:
    desc: "Print the three stores' healthcheck status. Exits non-zero if any is not healthy."
    cmds:
      - |
        overall=0
        for svc in postgres clickhouse redis; do
          cid=$(docker compose -f infra/dev/docker-compose.dev.yml --env-file infra/dev/.env ps -q "$svc" 2>/dev/null)
          if [ -z "$cid" ]; then
            status="missing"
          else
            status=$(docker inspect --format='{{`{{.State.Health.Status}}`}}' "$cid" 2>/dev/null || echo "unknown")
          fi
          printf "%-12s %s\n" "$svc" "$status"
          if [ "$status" != "healthy" ]; then overall=1; fi
        done
        exit $overall

  dev:reset-data:
    desc: "DESTRUCTIVE — stop containers AND remove named volumes (cg_pg_data, cg_ch_data, cg_redis_data, cg_ingest_certs). Use only when you mean to start from scratch."
    cmds:
      - docker compose -f infra/dev/docker-compose.dev.yml --env-file infra/dev/.env down -v --remove-orphans

  reset-data:
    desc: "Wipe local data volumes."
    cmds:
      - echo "task reset-data — populated by SPEC-XXX-infra"

  # ------------------------------------------------------------------
  # ingest: server ingest service operations (SPEC-004). Run from the
  # services/ingest workspace; env comes from the shell / compose.
  # ------------------------------------------------------------------
  ingest:migrate:
    desc: "Apply ingest Postgres migrations + bootstrap the ClickHouse table (single applier, SPEC-004 MUST-2)."
    dir: services/ingest
    cmds:
      - pnpm run migrate

  ingest:issue-token:
    desc: "Issue a single-use enrollment token (SPEC-004 FR-015). Optional: org=<id>. Prints the token to stdout."
    dir: services/ingest
    cmds:
      - pnpm run issue-token -- --org {{.org | default "default"}}

title: Executable With a Deceptive Name
id: rule.deceptive_executable_name
status: test
description: >
  An executable disguised as a document or a picture ran: a double extension
  (invoice.pdf.exe), a right-to-left override character (U+202E) in its path,
  or a screensaver or PIF outside the system folders. Does not need the parent.
references:
  - https://attack.mitre.org/techniques/T1204/002/
  - https://attack.mitre.org/techniques/T1036/002/
  - https://attack.mitre.org/techniques/T1036/007/
logsource:
  product: windows
  category: process_creation
detection:
  double_extension:
    Image|endswith:
      - '.pdf.exe'
      - '.doc.exe'
      - '.docx.exe'
      - '.xls.exe'
      - '.xlsx.exe'
      - '.ppt.exe'
      - '.pptx.exe'
      - '.rtf.exe'
      - '.txt.exe'
      - '.jpg.exe'
      - '.jpeg.exe'
      - '.png.exe'
      - '.zip.exe'
      - '.rar.exe'
  right_to_left_override:
    Image|contains:
      - "‮"
  screensaver_or_pif:
    Image|endswith:
      - '.scr'
      - '.pif'
  system_folder:
    Image|contains:
      - '\windows\system32\'
      - '\windows\syswow64\'
  condition: double_extension or right_to_left_override or (screensaver_or_pif and not system_folder)
level: high
tags:
  - attack.execution
  - attack.t1204.002
  - attack.defense-evasion
  - attack.t1036.002
  - attack.t1036.007
# CyberGuard extension (SPEC-016 §Data contracts §2): severity_id 4 = OCSF High
# for level high; final_score equals heuristic_score for a rule-only alert.
cg:
  heuristic_score: 0.85
  severity_id: 4
  cg_detection_source: rule
  cg_mitre:
    tactics:
      - execution
      - defense-evasion
    techniques:
      - T1204.002
      - T1036.002
      - T1036.007

title: Office Application Spawns a LOLBin
id: rule.office_spawns_lolbin
status: test
description: >
  A Microsoft Office application launched a binary commonly abused to proxy
  execution or to fetch a payload (rundll32, regsvr32, certutil, bitsadmin,
  msbuild, msiexec and similar). Outlook is not a parent here; its attachment
  path is rule.staged_payload_execution's. Keys on process image lineage; the
  parent is resolved per child with a 24 h look-back (SPEC-016 §Operational §1),
  so a parent that started before the agent is missed.
references:
  - https://attack.mitre.org/techniques/T1204/002/
  - https://attack.mitre.org/techniques/T1218/
logsource:
  product: windows
  category: process_creation
detection:
  selection:
    ParentImage|endswith:
      - '\winword.exe'
      - '\excel.exe'
      - '\powerpnt.exe'
      - '\msaccess.exe'
      - '\onenote.exe'
      - '\mspub.exe'
    Image|endswith:
      - '\rundll32.exe'
      - '\regsvr32.exe'
      - '\certutil.exe'
      - '\bitsadmin.exe'
      - '\schtasks.exe'
      - '\wmic.exe'
      - '\msbuild.exe'
      - '\installutil.exe'
      - '\regasm.exe'
      - '\regsvcs.exe'
      - '\msiexec.exe'
      - '\cmstp.exe'
      - '\odbcconf.exe'
      - '\curl.exe'
      - '\forfiles.exe'
  condition: selection
level: high
tags:
  - attack.execution
  - attack.t1204.002
  - attack.defense-evasion
  - attack.t1218
# CyberGuard extension (SPEC-016 §Data contracts §2): severity_id 4 = OCSF High
# for level high; final_score equals heuristic_score for a rule-only alert.
cg:
  heuristic_score: 0.8
  severity_id: 4
  cg_detection_source: rule
  cg_mitre:
    tactics:
      - execution
      - defense-evasion
    techniques:
      - T1204.002
      - T1218

title: Office Application Spawns a Script Host
id: rule.office_spawns_script_host
status: stable
description: >
  A Microsoft Office application spawned a command or scripting interpreter
  (PowerShell, cmd, Windows Script Host, mshta). Classic macro / phishing
  execution chain (MITRE T1566 -> T1059). Keys on process image lineage only;
  command-line content is unavailable in CGES v0.1 (the Kernel-Process provider
  emits no CommandLine). See SPEC-006 §Operational §4. The parent image is
  resolved by a parent-pid self-join over cges_events (SPEC-006 §Operational §2);
  in production this misses an already-running Office app (documented FN).
references:
  - https://attack.mitre.org/techniques/T1059/001/
  - https://attack.mitre.org/techniques/T1566/001/
logsource:
  product: windows
  category: process_creation
detection:
  selection:
    ParentImage|endswith:
      - '\winword.exe'
      - '\excel.exe'
      - '\powerpnt.exe'
      - '\outlook.exe'
      - '\msaccess.exe'
    Image|endswith:
      - '\powershell.exe'
      - '\pwsh.exe'
      - '\cmd.exe'
      - '\wscript.exe'
      - '\cscript.exe'
      - '\mshta.exe'
  condition: selection
level: high
tags:
  - attack.execution
  - attack.t1059.001
  - attack.initial_access
  - attack.t1566.001
# CyberGuard extension carrying the scoring / severity / MITRE the alert needs.
# heuristic_score 0.9 (fixture-04 precedent for this threat family; high
# confidence — Office spawning a script host is low-FP). severity_id 4 = OCSF
# High per common/ocsf_severity.json (Sigma level:high -> 4). tactics use names
# per common/cg_mitre.json, not TA-codes. SPEC-006 §Data contracts + §Ratification.
cg:
  heuristic_score: 0.9
  severity_id: 4
  cg_mitre:
    tactics:
      - execution
      - initial-access
    techniques:
      - T1059.001
      - T1566.001

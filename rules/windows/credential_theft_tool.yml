title: Credential Theft Tool Executed
id: rule.credential_theft_tool
status: test
description: >
  A credential-theft tool ran under its public name: LSASS dumping (mimikatz,
  nanodump, dumpert), Kerberos ticket abuse (rubeus, kekeo), or extraction from
  password stores (lazagne, sharpdpapi, sharpchrome). Renaming the binary evades
  the rule; it stays for commodity use. Does not need the parent.
references:
  - https://attack.mitre.org/techniques/T1003/001/
  - https://attack.mitre.org/techniques/T1555/
  - https://attack.mitre.org/techniques/T1558/
logsource:
  product: windows
  category: process_creation
detection:
  selection:
    Image|endswith:
      - '\mimikatz.exe'
      - '\safetykatz.exe'
      - '\sharpkatz.exe'
      - '\nanodump.exe'
      - '\dumpert.exe'
      - '\outflank-dumpert.exe'
      - '\rubeus.exe'
      - '\kekeo.exe'
      - '\lazagne.exe'
      - '\sharpdpapi.exe'
      - '\sharpchrome.exe'
  condition: selection
level: critical
tags:
  - attack.credential-access
  - attack.t1003.001
  - attack.t1555
  - attack.t1558
# CyberGuard extension (SPEC-016 §Data contracts §2): severity_id 5 = OCSF
# Critical for level critical; final_score equals heuristic_score for a
# rule-only alert.
cg:
  heuristic_score: 0.9
  severity_id: 5
  cg_detection_source: rule
  cg_mitre:
    tactics:
      - credential-access
    techniques:
      - T1003.001
      - T1555
      - T1558

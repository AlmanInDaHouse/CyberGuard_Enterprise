title: System Binary Name Outside the System Folders
id: rule.system_binary_masquerading
status: test
description: >
  A process named like a core Windows binary (svchost, lsass, csrss, rundll32,
  powershell, cmd and similar) ran outside System32, SysWOW64 and WinSxS, and
  not from the kernel's \SystemRoot\ form. pwsh.exe and explorer.exe are not
  listed: they live elsewhere legitimately. Anchoring on folder fragments means
  that a nested \windows\system32\ elsewhere evades the rule; that is accepted
  (SPEC-016 §Risks). Does not need the parent.
references:
  - https://attack.mitre.org/techniques/T1036/005/
logsource:
  product: windows
  category: process_creation
detection:
  system_binary_name:
    Image|endswith:
      - '\svchost.exe'
      - '\lsass.exe'
      - '\csrss.exe'
      - '\smss.exe'
      - '\wininit.exe'
      - '\winlogon.exe'
      - '\services.exe'
      - '\spoolsv.exe'
      - '\taskhostw.exe'
      - '\sihost.exe'
      - '\dwm.exe'
      - '\dllhost.exe'
      - '\conhost.exe'
      - '\rundll32.exe'
      - '\regsvr32.exe'
      - '\powershell.exe'
      - '\cmd.exe'
      - '\mshta.exe'
      - '\wscript.exe'
      - '\cscript.exe'
  system_folder:
    Image|contains:
      - '\windows\system32\'
      - '\windows\syswow64\'
      - '\windows\winsxs\'
  kernel_system_root:
    Image|startswith:
      - '\systemroot\'
  condition: system_binary_name and not system_folder and not kernel_system_root
level: high
tags:
  - attack.defense-evasion
  - attack.t1036.005
# CyberGuard extension (SPEC-016 §Data contracts §2): severity_id 4 = OCSF High
# for level high; final_score equals heuristic_score for a rule-only alert.
cg:
  heuristic_score: 0.8
  severity_id: 4
  cg_detection_source: rule
  cg_mitre:
    tactics:
      - defense-evasion
    techniques:
      - T1036.005

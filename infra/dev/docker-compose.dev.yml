# CyberGuard — local development stack (ADR-0003 storage backends).
# Dev only. Not for production. See infra/dev/README.md.

name: cyberguard-dev

networks:
  cyberguard-dev:
    driver: bridge

services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    networks: [cyberguard-dev]
    ports:
      - "${CG_PG_PORT:-5432}:5432"
    environment:
      POSTGRES_USER: ${CG_PG_USER:-cyberguard}
      POSTGRES_PASSWORD: ${CG_PG_PASSWORD:-cyberguard_dev}
      POSTGRES_DB: ${CG_PG_DB:-cyberguard}
    volumes:
      - cg_pg_data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  clickhouse:
    image: clickhouse/clickhouse-server:24.8
    restart: unless-stopped
    networks: [cyberguard-dev]
    ports:
      - "${CG_CH_HTTP_PORT:-8123}:8123"
      - "${CG_CH_TCP_PORT:-9000}:9000"
    environment:
      CLICKHOUSE_USER: ${CG_CH_USER:-cyberguard}
      CLICKHOUSE_PASSWORD: ${CG_CH_PASSWORD:-cyberguard_dev}
      CLICKHOUSE_DB: ${CG_CH_DB:-cyberguard}
    volumes:
      - cg_ch_data:/var/lib/clickhouse
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://localhost:8123/ping"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 15s

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    networks: [cyberguard-dev]
    ports:
      - "${CG_REDIS_PORT:-6379}:6379"
    environment:
      CG_REDIS_PASSWORD: ${CG_REDIS_PASSWORD:-cyberguard_dev}
    # Wrapped in sh -c so $CG_REDIS_PASSWORD is expanded by the container shell.
    command:
      - sh
      - -c
      - 'redis-server --appendonly yes --requirepass "$$CG_REDIS_PASSWORD"'
    volumes:
      - cg_redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$CG_REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s

  nats:
    image: nats:2.10-alpine
    restart: unless-stopped
    networks: [cyberguard-dev]
    ports:
      - "${CG_NATS_CLIENT_PORT:-4222}:4222"
      - "${CG_NATS_MONITOR_PORT:-8222}:8222"
    command: ["-js", "-sd", "/data", "-m", "8222"]
    volumes:
      - cg_nats_data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://localhost:8222/healthz"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s

  minio:
    image: minio/minio:RELEASE.2024-10-13T13-34-11Z
    restart: unless-stopped
    networks: [cyberguard-dev]
    ports:
      # Host 9001/9002 to avoid clash with ClickHouse TCP 9000.
      - "${CG_MINIO_API_PORT:-9001}:9000"
      - "${CG_MINIO_CONSOLE_PORT:-9002}:9001"
    environment:
      MINIO_ROOT_USER: ${CG_MINIO_ROOT_USER:-cyberguard}
      MINIO_ROOT_PASSWORD: ${CG_MINIO_ROOT_PASSWORD:-cyberguard_dev_minio_root}
    command: ["server", "/data", "--console-address", ":9001"]
    volumes:
      - cg_minio_data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -f -s http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  # SPEC-004 server ingest (TypeScript + Fastify, per ADR-0007). Built
  # from services/ingest/. Connects to the backends over the compose
  # network by service name (internal ports), independent of the host
  # port mappings above. This instance runs migrations (single applier).
  ingest:
    build:
      context: ../../services/ingest
      dockerfile: Dockerfile
    restart: unless-stopped
    networks: [cyberguard-dev]
    ports:
      - "${CG_INGEST_ENROLL_PORT:-8080}:8080"
      - "${CG_INGEST_HEARTBEAT_PORT:-8443}:8443"
    environment:
      INGEST_PG_URL: postgres://${CG_PG_USER:-cyberguard}:${CG_PG_PASSWORD:-cyberguard_dev}@postgres:5432/${CG_PG_DB:-cyberguard}
      INGEST_CH_URL: http://clickhouse:8123
      INGEST_CH_USER: ${CG_CH_USER:-cyberguard}
      INGEST_CH_PASSWORD: ${CG_CH_PASSWORD:-cyberguard_dev}
      INGEST_CH_DB: ${CG_CH_DB:-cyberguard}
      INGEST_REDIS_URL: redis://:${CG_REDIS_PASSWORD:-cyberguard_dev}@redis:6379
      INGEST_ENROLL_PORT: "8080"
      INGEST_HEARTBEAT_PORT: "8443"
      INGEST_SERVER_CERT_PATH: /certs/server.pem
      INGEST_SERVER_KEY_PATH: /certs/server-key.pem
      INGEST_CA_PASSPHRASE: ${CG_INGEST_CA_PASSPHRASE:-cyberguard_dev_ca_pass}
      INGEST_RUN_MIGRATIONS: "true"
      INGEST_LOG_LEVEL: ${CG_INGEST_LOG_LEVEL:-info}
    volumes:
      - cg_ingest_certs:/certs
    depends_on:
      postgres:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://localhost:8080/health || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 15s

  # SPEC-008 human-facing API / auth-core (TypeScript + Fastify, ADR-0014 §3).
  # Built from services/api/. The user-facing trust boundary, distinct from
  # ingest's agent-mTLS boundary. Reuses the SAME Postgres (users / audit_log) +
  # Redis (sessions / rate-limit) as the rest of the stack (ADR-0003 one-instance);
  # its OWN migration runner (API_RUN_MIGRATIONS) applies migrations 0001/0002
  # under a DISTINCT Kysely ledger table + advisory-lock key, so it never races
  # ingest's migrations on the shared database.
  api:
    build:
      context: ../../services/api
      dockerfile: Dockerfile
    restart: unless-stopped
    networks: [cyberguard-dev]
    ports:
      - "${CG_API_PORT:-8081}:8081"
    environment:
      API_PG_URL: postgres://${CG_PG_USER:-cyberguard}:${CG_PG_PASSWORD:-cyberguard_dev}@postgres:5432/${CG_PG_DB:-cyberguard}
      API_REDIS_URL: redis://:${CG_REDIS_PASSWORD:-cyberguard_dev}@redis:6379
      # Read-only ClickHouse reader for the forensic event drill (ADR-0015 / SPEC-010);
      # the api reads cges_events for GET /v1/incidents/:id/events. Same CH instance +
      # creds the ingest writer uses (ADR-0003 one-instance). Lazy client → a down
      # ClickHouse fails only the drill route, never the Postgres reads.
      API_CH_URL: http://clickhouse:8123
      API_CH_USER: ${CG_CH_USER:-cyberguard}
      API_CH_PASSWORD: ${CG_CH_PASSWORD:-cyberguard_dev}
      API_CH_DB: ${CG_CH_DB:-cyberguard}
      API_DB_ENC_PASSPHRASE: ${CG_API_DB_ENC_PASSPHRASE:-cyberguard_dev_api_pass}
      # SPEC-012 / ADR-0016 §5 — passphrase for the dedicated forensic Ed25519 signing
      # key at rest (pgcrypto), distinct from API_DB_ENC_PASSPHRASE and NOT the ingest CA.
      API_FORENSIC_PASSPHRASE: ${CG_API_FORENSIC_PASSPHRASE:-cyberguard_dev_forensic_pass}
      API_PORT: "8081"
      API_RUN_MIGRATIONS: "true"
      API_LOG_LEVEL: ${CG_API_LOG_LEVEL:-info}
    depends_on:
      postgres:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      # No /health endpoint yet (lands with the API surface, SPEC-009); a TCP
      # liveness probe on the bound port suffices for dev. Runs in-container.
      test:
        - "CMD-SHELL"
        - "node -e \"require('net').connect(8081,'127.0.0.1').on('connect',()=>process.exit(0)).on('error',()=>process.exit(1))\""
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 15s

volumes:
  cg_pg_data:
  cg_ch_data:
  cg_redis_data:
  cg_nats_data:
  cg_minio_data:
  cg_ingest_certs:

[package]
name = "cg-setup"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
description = "CyberGuard agent setup's elevated code: preflight, staging and configure (SPEC-024 Amendment 2026-11-09)."

# The library holds what preflight reads and decides, the staging, the
# record and the reversal, the SCM client, the installed binary's version,
# configure's observer, the command line and the verbs; `src/main.rs` is
# `cg-setup.exe` (SPEC-024 Amendment 2026-11-10, item 9), and `build.rs`
# gives it the agent's version resource through `../cg-agent/build_resource.rs`.
[lib]
name = "cg_setup"
path = "src/lib.rs"

# Test-only (SPEC-024 Amendment 2026-11-10, *Tests*, under the Amendment
# 2026-11-01, point 4): enables the test target that creates, starts, stops
# and deletes Windows services. It runs only in rust-ci's Windows job, on a
# disposable GitHub-hosted runner; `cargo test --all` and the elevated gate
# do not build it. Only that test target requires the feature, and no code
# of the library reads it.
[features]
scm-tests = []
# Test-only (the Amendment 2026-11-10, *Tests*, under the Amendment
# 2026-11-09's): enables the test targets that run the real `cg-setup`
# against the host and that install the agent's MSI on it. They run only in
# package-ci, on a disposable GitHub-hosted runner; rust-ci, `cargo test
# --all` and the elevated gate do not build them.
host-tests = []

# No libtest harness: the SCM starts this same test executable as the service
# the tests control, with the product's command line form, and its own
# `main` runs the tests otherwise.
[[test]]
name = "package_setup_service"
required-features = ["scm-tests"]
harness = false

# preflight then reverse under the machine's %ProgramData%.
[[test]]
name = "package_setup_host"
required-features = ["host-tests"]

# The agent's MSI installed, refused and uninstalled on the machine.
[[test]]
name = "package_msi_host"
required-features = ["host-tests"]

# The agent's setup, the bundle, run on the machine against cg-agent's test
# enrollment and heartbeat servers.
[[test]]
name = "package_bundle_host"
required-features = ["host-tests"]

# No new third-party crate (SPEC-024 Amendment 2026-11-09, item 1): each one
# below is already a dependency of cg-agent, at the same requirement.
[dependencies]
cg-agent = { path = "../cg-agent" }
pem = "3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
uuid = { version = "1.10", features = ["v7"] }
zeroize = "1.8"

# The workspace's existing Windows binding: RtlGetVersion and IsWow64Process2
# for the platform, CheckTokenMembership for the elevation, and the service
# control manager (Win32_System_Services), and the renames Windows holds for
# the next restart (Win32_System_Registry).
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Wdk_System_SystemServices",
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_LibraryLoader",
    "Win32_System_Registry",
    "Win32_System_Services",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
] }

[dev-dependencies]
tempfile = "3"
# The tests' certificates, as cg-agent's tests make theirs.
rcgen = { version = "0.13", default-features = false, features = ["pem", "ring"] }
# cg-agent's test enrollment and heartbeat servers (`../cg-agent/tests/common`),
# which the setup's host test runs the bundle against; each one at cg-agent's
# own requirement, so no crate enters Cargo.lock (Manuel, 2026-11-12).
axum = "0.7"
base64 = "0.22"
ed25519-dalek = { version = "2.1", features = ["zeroize", "pkcs8"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "logging"] }
serde_jcs = "0.1"
tokio = { version = "1.42", features = ["full", "macros", "test-util"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "logging", "tls12"] }

# The tests' standard user (NetUserAdd), and the message table FormatMessageW
# renders; features of the existing binding, which cg-agent's tests enable too.
[target.'cfg(windows)'.dev-dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_NetworkManagement_NetManagement",
    "Win32_Security_Authorization",
    "Win32_System_Diagnostics_Debug",
] }

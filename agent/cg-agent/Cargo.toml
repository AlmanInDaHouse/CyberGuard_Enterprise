[package]
name = "cg-agent"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
description = "CyberGuard endpoint agent — SPEC-001 (heartbeat)."

[[bin]]
name = "cg-agent"
path = "src/main.rs"

[lib]
name = "cg_agent"
path = "src/lib.rs"

# --- Runtime dependencies ---
#
# Pinned to minor versions, with rationale below. Patch updates are
# allowed by Cargo's default semver behavior. Bumps to a new minor
# require a commit body justification.
[dependencies]
# Async runtime. "full" features in dev to keep the surface easy;
# narrow when SPEC-001 stabilises and we know what we actually use.
tokio = { version = "1.42", features = ["full"] }

# Envelope serialization. serde + derive macros + JSON.
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Config parsing.
toml = "0.8"

# HTTP client. rustls-tls backend (no native OpenSSL dependency on
# Windows). When ADR-0004 (mTLS + Ed25519) lands in code, this crate
# is the natural place to add the mTLS configuration; the swap to
# tonic/gRPC happens in a future sub-SPEC.
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

# Structured logging. JSON formatter, env-filter for log.level overrides.
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json", "env-filter"] }

# CLI args. Minimal use in SPEC-001 (just --config); sets the pattern.
clap = { version = "4.5", features = ["derive"] }

# Error types. thiserror for library/domain errors, anyhow only at
# the top-level main() boundary.
thiserror = "2.0"
anyhow = "1.0"

# Graceful shutdown helpers. tokio::signal is used directly; tokio-util
# kept for future CancellationToken when transport gets richer.
tokio-util = "0.7"

# Date / time. Used for the wall-clock `sent_at` field in the
# heartbeat envelope (RFC 3339 / ISO 8601 UTC with milliseconds per
# SPEC-001 §Data contracts). default-features off to avoid pulling
# the legacy `time` 0.1 transitive dep.
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }

# --- SPEC-002 enrollment dependencies ---
#
# Ed25519 keypair generation and signing (rustcrypto org). The
# `zeroize` feature zeroes SigningKey material on drop. The `pkcs8`
# feature (SPEC-003) exports the key as PKCS#8 DER so rustls can use it
# as the TLS client-auth private key.
ed25519-dalek = { version = "2.1", features = ["zeroize", "pkcs8"] }

# OS entropy source for key generation (BCryptGenRandom on Windows,
# /dev/urandom on Unix). Used directly via getrandom() rather than
# pulling the full `rand` stack — SigningKey::from_bytes takes a raw
# [u8; 32] seed, so getrandom alone suffices.
getrandom = "0.2"

# Zero-on-drop wrapper for raw key bytes before they become a
# SigningKey, and for decrypted material in transit (NFR-002).
zeroize = { version = "1.8", features = ["zeroize_derive"] }

# base64url (unpadded) encoding of the 32-byte public key in the
# enrollment request (SPEC-002 §Data contracts).
base64 = "0.22"

# SHA-256 for the agent_pubkey_fingerprint cross-check (FR-008).
sha2 = "0.10"

# PEM decode/validate of the server-issued certificate (FR-006).
pem = "3"

# --- SPEC-003 mTLS + signed-envelope dependencies ---
#
# TLS 1.3 stack. `default-features = false` + explicit `ring` to match
# the provider reqwest already pulls (no aws-lc-rs in the tree) and avoid
# a second crypto backend. `tls12` is intentionally omitted; TLS 1.3 is
# further enforced at the ClientConfig level (SPEC-003 FR-003). Pinned to
# 0.23 to match reqwest 0.12's rustls so `use_preconfigured_tls` accepts
# our ClientConfig.
rustls = { version = "0.23", default-features = false, features = [
    "ring",
    "std",
    "logging",
] }

# PEM → rustls-pki-types parsing for the trust-anchor roots and the
# client certificate chain.
rustls-pemfile = "2"

# Async TLS for the secure heartbeat transport. `ring` + no `tls12`: the
# agent is TLS 1.3-only at the feature level (the dev-dependency below
# adds `tls12` for the test mock only, via feature unification).
tokio-rustls = { version = "0.26", default-features = false, features = [
    "ring",
    "logging",
] }

# JSON Canonicalization Scheme (RFC 8785) for the signed region
# (SPEC-003 §Data contracts). The envelope carries only ASCII strings,
# unsigned integers, and nested objects — no floats or sub-millisecond
# fractions — so the JCS number-format corners do not arise.
serde_jcs = "0.1"

# DPAPI bindings for at-rest key encryption at CRYPTPROTECT_LOCAL_MACHINE
# scope (SPEC-002 §Security considerations). Windows-only; the
# non-Windows SecureStore impl is test-only and uses no native deps.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Security_Cryptography",
] }

# --- Dev dependencies ---
#
# Mock HTTP server for the integration harness.
# axum picked over warp / hyper-direct because it builds on tokio +
# tower, is the most active maintenance line as of 2026, and the
# learning surface is the smallest of the three.
[dev-dependencies]
axum = "0.7"
tokio = { version = "1.42", features = ["full", "macros", "test-util"] }
tempfile = "3"

# --- SPEC-003 TLS harness (test-only) ---
#
# Generates the test trust material at setup (a test CA, the mock's
# server cert, and the agent's client cert) — never committed. `ring`
# (not the default aws-lc-rs) to match the in-tree provider and avoid a
# C build.
rcgen = { version = "0.13", default-features = false, features = ["pem", "ring"] }
# Server side of the TLS-enabled mock (TlsAcceptor over a raw TCP
# listener). rustls / rustls-pemfile are runtime deps, already available.
# `ring` provider (not the default aws-lc-rs) to match the tree and skip
# the aws-lc-sys C build; `tls12` so the mock can present a TLS-1.2-only
# server for AC-006 (the agent must refuse it).
tokio-rustls = { version = "0.26", default-features = false, features = [
    "ring",
    "logging",
    "tls12",
] }

# --- SPEC-005 Phase 3.4 harness (test-only) ---
#
# Docker container orchestration for AC-001/004/007/008/009 integration
# tests against real Postgres + ClickHouse + Redis + services/ingest. Pin
# `^0.27.0` per Cargo's default caret semver (accepts 0.27.x patch updates;
# refuses 0.28+), following the pre-1.0 active-development idiom. Latest
# stable at declaration is 0.27.3. Not consumed in Phase 3.4.A (AC-003 +
# AC-006 are pure-Rust); declared here so Phase 3.4.B+ test commits can be
# pure test-file additions. The async runner pattern
# (testcontainers::runners::AsyncRunner) is the canonical 0.27 API and
# matches the existing #[tokio::test(...)] convention in tests/.
testcontainers = "0.27"

# --- SPEC-005 Phase 3.4 harness (Windows-only, test-only) ---
#
# ETW crate per ADR-0008 §Decision part 1. Consumed by AC-009
# (events_lost ETW pressure) which sets up a standalone UserTrace
# session, induces dispatch backpressure, and invokes the agent's
# side-channel helper to observe the kernel's events_lost counter.
# Pin `^1.2.0` per ADR-0008's '1.2.0' decision (post-1.0 minor pin
# idiom; accepts 1.2.x patches, refuses 2.0). Target-conditional —
# ferrisetw consumes Win32 ETW APIs and is Windows-only; non-Windows
# cross-checks must not attempt to fetch or compile it.
[target.'cfg(windows)'.dev-dependencies]
ferrisetw = "1.2"

# --- Lint configuration ---
#
# clippy::zombie_processes: AC-004 cache-hit test (process_ac_004_created_time_
# cache.rs) spawns a probe via Command::new("cmd.exe").spawn() without calling
# .wait() on the returned Child. The test relies on the agent's ETW path to
# capture both Launch and Terminate events emitted by the OS for that probe,
# rather than on the test process explicitly waiting. Production cg-agent code
# does not exhibit this pattern (no Command::spawn in lib/). Crate-scoped allow
# ratified by Manuel during Phase 3.5.B to unblock AC-004 cache-miss GREEN
# without modifying Phase 3.4 RED test files.
[lints.clippy]
zombie_processes = "allow"
